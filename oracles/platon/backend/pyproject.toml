[project]
# `aimarket-platon`, NOT `platon`. That short name on PyPI is an unrelated exoplanet
# atmosphere package (currently 6.3) which installs its own top-level `platon`
# module. Nothing here resolves the name from the index — installs are by path — but
# `pip list --outdated` reported our 0.1.0 as "outdated" against it, so a routine
# `pip install --upgrade platon` would have replaced this oracle backend with an
# astronomy library. Same class as the oracle-core collision; see core/pyproject.toml.
# NOT "aimarket-platon": that distribution name belongs to platon/backend/ (0.1.1, the
# tree that is byte-identical to what is on PyPI). This copy is the oracle-family
# vendoring, it has diverged (9 files, incl. a prompt_firewall.py the published wheel
# never had), and while it declared the same name a publish from here would have
# overwritten the canonical package with an older, different codebase.
name = "aimarket-oracle-platon"
version = "0.1.0"
description = "UMBRAL — 32D dynamical shadow oracle for the AIMarket ecosystem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=2.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dateutil>=2.9.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "dilithium-py>=1.4.0",
]
# Post-quantum hybrid signatures (ML-DSA-65 / FIPS 204). Enable with PLATON_PQC_ENABLED=1.
pqc = [
    "dilithium-py>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
