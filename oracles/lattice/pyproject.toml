[project]
# Renamed from "lattice-oracle" on 2026-07-30, before first publish. Unprefixed short names on
# PyPI belong to other people and can install colliding top-level modules — the incident
# that made this a rule is recorded at the top of oracles/core/pyproject.toml. "lattice-oracle"
# was unclaimed, which is not safe but claimable: anyone taking it makes
# `pip install lattice-oracle` fetch their code into a namespace this repo imports.
name = "aimarket-oracle-lattice"
version = "0.1.0"
description = "Lattice — low-discrepancy (quasi-random) sequence oracle on oracle-core"
requires-python = ">=3.11"
dependencies = ["aimarket-oracle-core>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lattice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
