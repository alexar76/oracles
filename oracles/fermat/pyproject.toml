[project]
# Renamed from "fermat-oracle" on 2026-07-30, before first publish. Unprefixed short names on
# PyPI belong to other people and can install colliding top-level modules — the incident
# that made this a rule is recorded at the top of oracles/core/pyproject.toml. "fermat-oracle"
# was unclaimed, which is not safe but claimable: anyone taking it makes
# `pip install fermat-oracle` fetch their code into a namespace this repo imports.
name = "aimarket-oracle-fermat"
version = "0.1.0"
description = "Fermat — least-time routing/composition oracle with a dual optimality certificate, on oracle-core"
requires-python = ">=3.11"
dependencies = ["aimarket-oracle-core>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fermat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
