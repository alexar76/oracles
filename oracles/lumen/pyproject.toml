[project]
# Renamed from "lumen-oracle" on 2026-07-30, before first publish. Unprefixed short names on
# PyPI belong to other people and can install colliding top-level modules — the incident
# that made this a rule is recorded at the top of oracles/core/pyproject.toml. "lumen-oracle"
# was unclaimed, which is not safe but claimable: anyone taking it makes
# `pip install lumen-oracle` fetch their code into a namespace this repo imports.
name = "aimarket-oracle-lumen"
version = "0.1.0"
description = "Lumen — reputation / trust scoring (EigenTrust / PageRank) oracle on oracle-core"
requires-python = ">=3.11"
dependencies = ["aimarket-oracle-core>=0.2", "numpy"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
