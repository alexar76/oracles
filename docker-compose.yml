# Oracle family — each oracle is an independent service on the shared protocol.
services:
  oracles-landing:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5180:80"
    restart: unless-stopped

  chronos:
    # Not root, no capabilities, no escalation. uid 10001 must own the volumes it writes.
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: oracles/chronos/Dockerfile
    environment:
      CHRONOS_PORT: "9300"
      # Whose X-Real-IP / X-Forwarded-For count: the host's nginx, which reaches the published port
      # through the docker gateway. Not every private address (Vulnetix GCVE-110-VULN-PYPI-2026-000637).
      ORACLE_TRUSTED_PROXIES: ${ORACLE_TRUSTED_PROXIES:-127.0.0.1/32,::1/128,gateway}
      # Advertised behind the TLS edge (nginx `location /chronos/`), not the raw port.
      CHRONOS_PUBLIC_URL: ${CHRONOS_PUBLIC_URL:-https://oracles.modelmarket.dev/chronos}
      # Hybrid ML-DSA-65 + Ed25519 (phase-2). Both identities persist in the
      # dedicated volume below; a container rebuild must never rotate a pinned key.
      ORACLE_PQC: ${ORACLE_PQC:-1}
      # ORACLE_SIGNING_SEED_B64: "<from KMS>" # inject the key, never on disk
      # The price gate (core/oracle_core/price_gate.py): priced capabilities answer only a call a
      # hub in ORACLE_TRUSTED_HUBS ("url=ed25519 key,…") signed, or 402. Empty leaves it off, as
      # before. ORACLE_PRICE_GATE=report logs what it would refuse first. Values in ./.env.
      ORACLE_TRUSTED_HUBS: ${ORACLE_TRUSTED_HUBS:-}
      ORACLE_PRICE_GATE: ${ORACLE_PRICE_GATE:-}
      ORACLE_HUB_AUDIENCES: ${ORACLE_HUB_AUDIENCES:-}
      # The call log (core/oracle_core/calls.py): every invoke written down, SQLite in the data
      # volume unless ORACLE_DATABASE_URL names Postgres; read at /ops/v1/* with ORACLE_OPS_TOKEN
      # (the routes answer 503 without one).
      ORACLE_CALLS: ${ORACLE_CALLS:-1}
      ORACLE_DATA_DIR: /app/data
      ORACLE_DATABASE_URL: ${ORACLE_DATABASE_URL:-}
      ORACLE_OPS_TOKEN: ${ORACLE_OPS_TOKEN:-}
      ORACLE_CALLS_RETENTION_DAYS: ${ORACLE_CALLS_RETENTION_DAYS:-90}
    ports:
      # Loopback only — published through nginx /chronos/ (TLS + per-IP limit),
      # never raw on 0.0.0.0. A 0.0.0.0 bind would insert a Docker DNAT rule that
      # precedes UFW and exposes the oracle on plain HTTP to the whole internet.
      - "127.0.0.1:9300:9300"
    volumes:
      - chronos_data:/app/data
    restart: unless-stopped

  # Oracle Family — ONE endpoint, all 11 oracles in one signed manifest.
  # Serves the 10 oracle_core oracles (chronos/lattice/murmuration/lumen/colony/
  # turing/percola/fermat/ablation/landauer) locally, and FEDERATES the live
  # Platon oracle (proxies platon.*
  # invokes to it over the `ecosystem` network).
  oracle-family:
    # Not root, no capabilities, no escalation. uid 10001 must own the volumes it writes.
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: oracles/oracle-family/Dockerfile
    environment:
      ORACLE_FAMILY_PORT: "9400"
      # Whose X-Real-IP / X-Forwarded-For count: the host's nginx, through the docker gateway.
      ORACLE_TRUSTED_PROXIES: ${ORACLE_TRUSTED_PROXIES:-127.0.0.1/32,::1/128,gateway}
      ORACLE_FAMILY_PUBLIC_URL: ${ORACLE_FAMILY_PUBLIC_URL:-https://oracles.modelmarket.dev/family}
      ORACLE_FAMILY_PLATON_URL: ${ORACLE_FAMILY_PLATON_URL:-http://platon-backend:9200}
      # Hybrid ML-DSA-65 + Ed25519. PQ key persists next to Ed25519 under
      # oracle_family_data (`…_mldsa`). Phase-2 only — do not set
      # ORACLE_PQC_REQUIRE=1 fleet-wide until every signer emits pq_*.
      ORACLE_PQC: ${ORACLE_PQC:-1}
      # The price gate (core/oracle_core/price_gate.py): priced capabilities answer only a call a
      # hub in ORACLE_TRUSTED_HUBS ("url=ed25519 key,…") signed, or 402. Empty leaves it off, as
      # before. ORACLE_PRICE_GATE=report logs what it would refuse first. Values in ./.env.
      ORACLE_TRUSTED_HUBS: ${ORACLE_TRUSTED_HUBS:-}
      ORACLE_PRICE_GATE: ${ORACLE_PRICE_GATE:-}
      ORACLE_HUB_AUDIENCES: ${ORACLE_HUB_AUDIENCES:-}
      # The call log (core/oracle_core/calls.py): every invoke written down, SQLite in the data
      # volume unless ORACLE_DATABASE_URL names Postgres; read at /ops/v1/* with ORACLE_OPS_TOKEN
      # (the routes answer 503 without one).
      ORACLE_CALLS: ${ORACLE_CALLS:-1}
      ORACLE_DATA_DIR: /app/data
      ORACLE_DATABASE_URL: ${ORACLE_DATABASE_URL:-}
      ORACLE_OPS_TOKEN: ${ORACLE_OPS_TOKEN:-}
      ORACLE_CALLS_RETENTION_DAYS: ${ORACLE_CALLS_RETENTION_DAYS:-90}
    ports:
      # Loopback only — published via nginx `location /family/` (TLS + per-IP limit).
      - "127.0.0.1:9400:9400"
    volumes:
      # The Ed25519 signing key IS this peer's identity. Without a volume it lived in the
      # container filesystem and `compose up --build` minted a new one, so every hub that
      # had pinned the old key answered "public key changed! Rejecting (possible
      # takeover)" and dropped all 22 capabilities — the anti-takeover check firing on our
      # own redeploy. Persisted, a rebuild keeps the identity.
      - oracle_family_data:/app/data
    restart: unless-stopped
    networks:
      - default
      - ecosystem

  # Platon (oracle #1) ships from oracles/platon/ — its own backend/Dockerfile + UMBRAL cave.
  # platon:
  #   build: { context: oracles/platon, dockerfile: backend/Dockerfile }
  #   ports: ["9200:9200"]

networks:
  ecosystem:
    external: true

volumes:
  # Keeps Chronos Ed25519 and ML-DSA identities stable across rebuilds.
  chronos_data:
  # Keeps the oracle-family signing key — and therefore its federated identity —
  # stable across `compose up --build`.
  oracle_family_data:
